name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:
        inputs:
            base_sha:
                description: '用于耗时测量的 Git 对比基线；留空执行全量检查'
                type: string
                required: false

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

# Turbo Remote Cache — Vercel Remote Cache
# 配置步骤（仅需一次）：
#   1. 在仓库根目录运行 `pnpm dlx turbo login`，浏览器授权 Vercel 账号
#   2. 运行 `pnpm dlx turbo link`，选择目标 Vercel 团队并启用 Remote Caching
#   3. 在 GitHub 仓库 Settings 配置：
#      - Secrets → Actions → New repository secret：`TURBO_TOKEN`（值见 ~/.turbo/config.json 的 token 字段）
#      - Variables → Actions → New repository variable：`TURBO_TEAM`（Vercel 团队 slug，即 vercel.com/<team-slug>）
#   4. 在 Vercel 团队 Settings → Remote Caching，确保 TURBO_TOKEN 对应的角色拥有
#      "Remote Cache Artifact" 写权限（默认 token 可能只有读权限，需手动授予写权限）
# 注：TURBO_TEAM 使用 variables 而非 secrets，因为团队 slug 非敏感信息（GitHub 最佳实践）

jobs:
    changes:
        name: Change scope
        runs-on: ubuntu-latest
        outputs:
            full: ${{ steps.scope.outputs.full }}
            ui: ${{ steps.scope.outputs.ui }}
            cli: ${{ steps.scope.outputs.cli }}
            registry: ${{ steps.scope.outputs.registry }}
            docs: ${{ steps.scope.outputs.docs }}
            site: ${{ steps.scope.outputs.site }}
            generated: ${{ steps.scope.outputs.generated }}
            tooling: ${{ steps.scope.outputs.tooling }}
            release: ${{ steps.scope.outputs.release }}
            browser: ${{ steps.scope.outputs.browser }}
            consumers: ${{ steps.scope.outputs.consumers }}
            cost: ${{ steps.scope.outputs.cost }}
            json: ${{ steps.scope.outputs.json }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 0
            - name: Classify changed inputs
              id: scope
              env:
                  BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.before }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
                  EVENT_NAME: ${{ github.event_name }}
              run: |
                  if [[ "$EVENT_NAME" == pull_request ]]; then
                    node scripts/ci/change-scope.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
                  elif [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
                    node scripts/ci/change-scope.mjs --base "$HEAD_SHA" --head "$HEAD_SHA" --diff-mode direct
                  else
                    node scripts/ci/change-scope.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --diff-mode direct
                  fi
    quality:
        name: Quality (build + typecheck + lint + validate)
        needs: changes
        runs-on: ubuntu-latest
        env:
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # Changeset 与提交规范检查需要 PR 提交范围。
                  fetch-depth: 0

            - name: Check changeset presence (PR only)
              if: github.event_name == 'pull_request' && !contains(github.event.pull_request.title, '[no-changeset]')
              run: |
                  base="origin/${{ github.base_ref }}"
                  git fetch origin "${{ github.base_ref }}" --depth=1 || true
                  added=$(git diff --name-only "$base...HEAD" -- '.changeset/*.md' ':!.changeset/README.md' | wc -l)
                  code_changed=$(git diff --name-only "$base...HEAD" -- 'packages/ui/src/' 'packages/cli/src/' 'packages/ui/package.json' 'packages/cli/package.json' | wc -l)
                  if [ "$code_changed" -gt 0 ] && [ "$added" -eq 0 ]; then
                    echo "::error::代码变更未声明 changeset。请运行 'pnpm changeset' 生成变更说明；纯文档/CI 改动请在 PR 标题加 '[no-changeset]'。"
                    exit 1
                  fi
                  echo "✓ Changeset 检查通过（$added 个新增 changeset）"

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: pnpm

            - name: Record Node runtime for Turbo task cache
              run: echo "BRUTX_RUNTIME_VERSION=$(node -p process.version)" >> "$GITHUB_ENV"

            - run: pnpm install --frozen-lockfile --prefer-offline

            - name: Cache turbo local build cache
              if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.registry == 'true' || needs.changes.outputs.tooling == 'true'
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .turbo/cache
                  key: ${{ runner.os }}-turbo-node22-quality-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-node22-quality-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-
                      ${{ runner.os }}-turbo-node22-quality-

            - name: Verify all generated and mixed files (read-only)
              if: needs.changes.outputs.generated == 'true'
              run: pnpm check:generated

            - name: Build and verify selected package graph
              env:
                  UI: ${{ needs.changes.outputs.ui }}
                  CLI: ${{ needs.changes.outputs.cli }}
                  REGISTRY: ${{ needs.changes.outputs.registry }}
                  TOOLING: ${{ needs.changes.outputs.tooling }}
              run: |
                  filters=(--filter=brutx-shared-vue)
                  [[ "$UI" != true ]] || filters+=(--filter=brutx-ui-vue)
                  [[ "$CLI" != true ]] || filters+=(--filter=brutx-vue)
                  [[ "$REGISTRY" != true ]] || filters+=(--filter=brutx-registry-vue)
                  if [[ "$UI" == true || "$CLI" == true || "$REGISTRY" == true || "$TOOLING" == true ]]; then
                    pnpm exec turbo run build:artifact typecheck:source lint:source validate "${filters[@]}"
                  fi

            - name: Verify code and spec contracts (parallel)
              if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.registry == 'true'
              run: pnpm check:contracts

            - name: Test current generation and tooling contracts
              if: needs.changes.outputs.tooling == 'true' || needs.changes.outputs.generated == 'true' || needs.changes.outputs.ui == 'true'
              run: |
                  pnpm --filter brutx-ui-vue generate
                  pnpm test:tooling

            - name: Public type consumer check
              if: needs.changes.outputs.ui == 'true'
              run: pnpm --filter brutx-ui-vue test:types

            - name: Verify bundle isolation
              if: needs.changes.outputs.ui == 'true'
              run: pnpm --filter brutx-ui-vue check:isolation

            - name: Verify documentation integrity (parallel)
              if: needs.changes.outputs.docs == 'true'
              run: pnpm check:docs

            - name: Package smoke test (exports subpaths + consumer resolution)
              if: needs.changes.outputs.ui == 'true'
              run: pnpm --filter brutx-ui-vue test:package

            - name: Release verification and coordinator tests
              if: needs.changes.outputs.release == 'true'
              run: pnpm test:release

            - name: Check bundle size limits
              if: needs.changes.outputs.ui == 'true'
              run: pnpm --filter brutx-ui-vue size

            - name: Commitlint on PR commits
              if: github.event_name == 'pull_request'
              env:
                  BASE_REF: ${{ github.base_ref }}
              run: |
                  # base 分支名经 env 传入，避免直接内插进 run: 脚本的注入风险
                  base="origin/$BASE_REF"
                  git fetch origin "$BASE_REF" --depth=50
                  # PR 检出合成 merge commit，提交规范检查使用 base..HEAD 的分支提交。
                  git log --format="%an%x09%ae%x09%s" --no-merges "$base..HEAD" | while IFS=$'\t' read -r author email subject; do
                    [ -z "$subject" ] && continue
                    if [[ "$author" == *"[bot]"* ]] || [[ "$email" == *"@users.noreply.github.com"* && "$email" == *"bot"* ]]; then
                      echo "::notice::自动化提交豁免 commitlint 校验: ($author) $subject"
                      continue
                    fi
                    echo "$subject" | pnpm exec commitlint || { echo "::error::提交信息不符合规范（描述≤50字符/type 合规）：$subject"; exit 1; }
                  done

            - name: i18n mirror check
              if: needs.changes.outputs.docs == 'true'
              run: pnpm check:i18n:strict

    test:
        name: Test (Node ${{ matrix.node-version }})
        needs: changes
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.registry == 'true' || needs.changes.outputs.tooling == 'true'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: [22, 24]
        env:
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: pnpm

            - name: Record Node runtime for Turbo task cache
              run: echo "BRUTX_RUNTIME_VERSION=$(node -p process.version)" >> "$GITHUB_ENV"

            - run: pnpm install --frozen-lockfile --prefer-offline

            - name: Cache turbo local build cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .turbo/cache
                  key: ${{ runner.os }}-turbo-test-node${{ matrix.node-version }}-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-test-node${{ matrix.node-version }}-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-
                      ${{ runner.os }}-turbo-test-node${{ matrix.node-version }}-

            - name: Test selected packages and SSR
              env:
                  UI: ${{ needs.changes.outputs.ui }}
                  CLI: ${{ needs.changes.outputs.cli }}
                  REGISTRY: ${{ needs.changes.outputs.registry }}
              run: |
                  filters=(--filter=brutx-shared-vue)
                  [[ "$CLI" != true ]] || filters+=(--filter=brutx-vue)
                  [[ "$REGISTRY" != true ]] || filters+=(--filter=brutx-registry-vue)
                  pnpm exec turbo run test "${filters[@]}"
                  if [[ "$UI" == true ]]; then
                    pnpm exec turbo run test:ssr --filter=brutx-ui-vue
                  fi

    ui-test:
        name: UI test (Node 24, shard ${{ matrix.shard-index }}/${{ matrix.shard-total }})
        needs: changes
        if: needs.changes.outputs.ui == 'true'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                shard-index: [1, 2]
                shard-total: [2]
        env:
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: pnpm
            - name: Record Node runtime for Turbo task cache
              run: echo "BRUTX_RUNTIME_VERSION=$(node -p process.version)" >> "$GITHUB_ENV"
            - run: pnpm install --frozen-lockfile --prefer-offline
            - name: Cache UI test results
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .turbo/cache
                  key: ${{ runner.os }}-turbo-node24-ui-shard${{ matrix.shard-index }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-node24-ui-shard${{ matrix.shard-index }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            - name: Test UI source and tooling shard
              run: pnpm exec turbo run test --filter=brutx-ui-vue -- --shard=${{ matrix.shard-index }}/${{ matrix.shard-total }}

    coverage-shard:
        name: UI coverage shard (${{ matrix.shard-index }}/${{ matrix.shard-total }})
        needs: changes
        if: needs.changes.outputs.ui == 'true'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                shard-index: [1, 2]
                shard-total: [2]
        env:
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: pnpm

            - name: Record Node runtime for Turbo task cache
              run: echo "BRUTX_RUNTIME_VERSION=$(node -p process.version)" >> "$GITHUB_ENV"

            - run: pnpm install --frozen-lockfile --prefer-offline

            - name: Generate component index and styles
              run: pnpm --filter brutx-ui-vue generate

            - name: Measure source coverage shard
              run: pnpm --filter brutx-ui-vue exec vitest run --config vitest.coverage-shard.config.ts --coverage --reporter=default --reporter=blob --shard=${{ matrix.shard-index }}/${{ matrix.shard-total }}
            - name: Upload source coverage measurements
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ui-coverage-shard-${{ matrix.shard-index }}
                  path: packages/ui/.vitest-reports
                  include-hidden-files: true
                  if-no-files-found: error

    coverage:
        name: UI coverage
        needs: [changes, coverage-shard]
        if: needs.changes.outputs.ui == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile --prefer-offline
            - run: pnpm --filter brutx-ui-vue generate
            - name: Download source coverage measurements
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: ui-coverage-shard-*
                  path: packages/ui/.vitest-reports
                  merge-multiple: true
            - name: UI coverage
              id: ui-coverage
              run: pnpm --filter brutx-ui-vue exec vitest run --config vitest.coverage.config.ts --merge-reports --coverage
            - name: Record UI coverage environment
              if: always() && steps.ui-coverage.outcome != 'skipped'
              env:
                  COVERAGE_OUTCOME: ${{ steps.ui-coverage.outcome }}
              run: |
                  node --input-type=module <<'NODE'
                  import { mkdirSync, writeFileSync } from 'node:fs'
                  import { execFileSync } from 'node:child_process'
                  import { platform, release } from 'node:os'
                  const command = (program, args) => execFileSync(program, args, { encoding: 'utf8' }).trim()
                  const directory = 'packages/ui/coverage/full'
                  mkdirSync(directory, { recursive: true })
                  writeFileSync(`${directory}/environment.json`, JSON.stringify({
                    commit: process.env.GITHUB_SHA,
                    workingTree: command('git', ['status', '--short']),
                    os: `${platform()} ${release()}`,
                    node: process.version,
                    pnpm: command('pnpm', ['--version']),
                    vitest: command('pnpm', ['--filter', 'brutx-ui-vue', 'exec', 'vitest', '--version']),
                    command: 'pnpm --filter brutx-ui-vue exec vitest run --config vitest.coverage.config.ts --merge-reports --coverage',
                    outcome: process.env.COVERAGE_OUTCOME,
                    run: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
                  }, null, 2))
                  NODE

            - name: Upload UI coverage evidence
              if: always() && steps.ui-coverage.outcome != 'skipped'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ui-coverage-${{ github.sha }}
                  path: packages/ui/coverage/full
                  if-no-files-found: error

    browser:
        name: Browser tests (Vitest + Playwright)
        needs: changes
        if: needs.changes.outputs.browser == 'true' || needs.changes.outputs.cost == 'true'
        runs-on: ubuntu-latest
        env:
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: pnpm

            - name: Record Node runtime for Turbo task cache
              run: echo "BRUTX_RUNTIME_VERSION=$(node -p process.version)" >> "$GITHUB_ENV"

            - run: pnpm install --frozen-lockfile --prefer-offline

            - name: Cache turbo local build cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .turbo/cache
                  key: ${{ runner.os }}-turbo-node22-browser-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-node22-browser-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-
                      ${{ runner.os }}-turbo-node22-browser-

            - name: Cache Playwright Browser Binaries
              id: playwright-cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: ${{ runner.os }}-playwright-

            - name: Clean up problematic APT repositories
              run: |
                  sudo rm -f /etc/apt/sources.list.d/azure-cli.list*
                  sudo rm -f /etc/apt/sources.list.d/microsoft*

            - name: Install Playwright Browser and Deps
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: pnpm --filter brutx-ui-vue exec playwright install --with-deps chromium

            - name: Install Playwright Dependencies (when cache hit)
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: pnpm --filter brutx-ui-vue exec playwright install-deps chromium

            - name: Prepare browser source and selected artifact
              run: pnpm --filter brutx-ui-vue generate

            - name: Build UI artifact for Button resource checks
              if: needs.changes.outputs.cost == 'true'
              run: pnpm exec turbo run build:artifact --filter=brutx-ui-vue

            - name: Browser tests
              if: needs.changes.outputs.browser == 'true'
              run: pnpm --filter brutx-ui-vue test:browser

            - name: Pack candidate artifact for cost checks
              if: needs.changes.outputs.cost == 'true'
              run: |
                  cost_artifact_dir="$RUNNER_TEMP/brutx-cost-artifact"
                  mkdir -p "$cost_artifact_dir"
                  pnpm --config.ignore-scripts=true --filter brutx-ui-vue pack --pack-destination "$cost_artifact_dir"
                  cost_artifact="$(find "$cost_artifact_dir" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
                  if [ -z "$cost_artifact" ]; then
                    echo "::error::未找到候选 UI tarball，无法运行成本门禁。"
                    exit 1
                  fi
                  echo "BRUTX_COST_ARTIFACT=$cost_artifact" >> "$GITHUB_ENV"

            - name: Button browser resource assertions and byte report
              if: needs.changes.outputs.cost == 'true'
              run: pnpm --filter brutx-ui-vue exec tsx perf/cost-runner.ts --artifact "$BRUTX_COST_ARTIFACT" --output "$RUNNER_TEMP/brutx-cost-result" --assert-resources --scenario empty --scenario button-root --scenario button-subpath --scenario button-root-dynamic

            - name: Upload Button cost evidence
              if: always() && needs.changes.outputs.cost == 'true'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: button-cost-${{ github.sha }}
                  path: ${{ runner.temp }}/brutx-cost-result
                  if-no-files-found: ignore

    integration:
        name: CLI Integration tests
        needs: changes
        if: needs.changes.outputs.cli == 'true'
        runs-on: ubuntu-latest
        env:
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: pnpm

            - name: Record Node runtime for Turbo task cache
              run: echo "BRUTX_RUNTIME_VERSION=$(node -p process.version)" >> "$GITHUB_ENV"

            - run: pnpm install --frozen-lockfile --prefer-offline

            - name: Cache turbo local build cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .turbo/cache
                  key: ${{ runner.os }}-turbo-node22-integration-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-node22-integration-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-
                      ${{ runner.os }}-turbo-node22-integration-

            - name: Build CLI and Registry artifacts
              run: pnpm exec turbo run build:artifact --filter=brutx-vue --filter=brutx-registry-vue

            - name: CLI Integration tests
              run: pnpm --filter brutx-vue test:integration

    consumers:
        name: Real Consumer tests (U1 / C1 / C3)
        needs: changes
        if: needs.changes.outputs.consumers == 'true'
        runs-on: ubuntu-latest
        env:
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: pnpm

            - name: Record Node runtime for Turbo task cache
              run: echo "BRUTX_RUNTIME_VERSION=$(node -p process.version)" >> "$GITHUB_ENV"

            - run: pnpm install --frozen-lockfile --prefer-offline

            - name: Cache turbo local build cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .turbo/cache
                  key: ${{ runner.os }}-turbo-node22-consumers-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-node22-consumers-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-
                      ${{ runner.os }}-turbo-node22-consumers-

            - name: Build consumer artifacts
              run: pnpm exec turbo run build:artifact --filter=brutx-ui-vue --filter=brutx-vue --filter=brutx-registry-vue

            - name: Pack shared consumer artifacts
              run: node --input-type=module -e "import { packCandidateArtifacts } from './scripts/testing/consumer-artifacts.mjs'; packCandidateArtifacts(process.env.RUNNER_TEMP + '/brutx-consumers')"

            - name: Run consumer matrix tests
              run: pnpm test:consumers --all --artifacts "$RUNNER_TEMP/brutx-consumers"

            - name: Upload consumer evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: consumers-${{ github.sha }}
                  path: ${{ runner.temp }}/brutx-consumers

    site:
        name: Documentation site
        needs: changes
        if: needs.changes.outputs.site == 'true'
        runs-on: ubuntu-latest
        env:
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 22
                  cache: pnpm
            - name: Record Node runtime for Turbo task cache
              run: echo "BRUTX_RUNTIME_VERSION=$(node -p process.version)" >> "$GITHUB_ENV"
            - run: pnpm install --frozen-lockfile --prefer-offline
            - name: Cache turbo local build cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
              with:
                  path: .turbo/cache
                  key: ${{ runner.os }}-turbo-node22-site-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-node22-site-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            - name: Build and typecheck docs
              run: pnpm exec turbo run build:artifact typecheck:source --filter=docs

    ci-gate:
        name: ${{ github.event_name == 'workflow_dispatch' && 'CI Timing (selected checks)' || 'CI Gate (all checks passed)' }}
        if: always()
        needs: [changes, quality, test, ui-test, coverage-shard, coverage, browser, integration, consumers, site]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - name: Evaluate selected checks
              env:
                  FLAGS: ${{ needs.changes.outputs.json }}
                  RESULTS: ${{ toJSON(needs) }}
                  CLASSIFICATION_RESULT: ${{ needs.changes.result }}
              run: |
                  node --input-type=module <<'NODE'
                  import { evaluateGate } from './scripts/ci/evaluate-gate.mjs'
                  const flags = JSON.parse(process.env.FLAGS || '{}')
                  const selected = ['quality']
                  if (flags.ui || flags.cli || flags.registry || flags.tooling) selected.push('test')
                  if (flags.ui) selected.push('ui-test', 'coverage-shard', 'coverage')
                  if (flags.browser || flags.cost) selected.push('browser')
                  if (flags.cli) selected.push('integration')
                  if (flags.consumers) selected.push('consumers')
                  if (flags.site) selected.push('site')
                  const result = evaluateGate({ classificationResult: process.env.CLASSIFICATION_RESULT, selected, needs: JSON.parse(process.env.RESULTS) })
                  console.log(JSON.stringify(result, null, 2))
                  if (!result.passed) process.exitCode = 1
                  NODE
