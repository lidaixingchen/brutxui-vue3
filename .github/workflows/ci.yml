name: CI

on:
    push:
        branches: [main, vue]
    pull_request:
        branches: [main, vue]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

# Turbo Remote Cache — Vercel Remote Cache
# 配置步骤（仅需一次）：
#   1. 在仓库根目录运行 `pnpm dlx turbo login`，浏览器授权 Vercel 账号
#   2. 运行 `pnpm dlx turbo link`，选择目标 Vercel 团队并启用 Remote Caching
#   3. 在 GitHub 仓库 Settings 配置：
#      - Secrets → Actions → New repository secret：`TURBO_TOKEN`（值见 ~/.turbo/config.json 的 token 字段）
#      - Variables → Actions → New repository variable：`TURBO_TEAM`（Vercel 团队 slug，即 vercel.com/<team-slug>）
#   4. 在 Vercel 团队 Settings → Remote Caching，确保 TURBO_TOKEN 对应的角色拥有
#      "Remote Cache Artifact" 写权限（默认 token 可能只有读权限，需手动授予写权限）
# 注：TURBO_TEAM 使用 variables 而非 secrets，因为团队 slug 非敏感信息（GitHub 最佳实践）

jobs:
    quality:
        name: Quality (build + typecheck + lint + validate)
        runs-on: ubuntu-latest
        env:
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # Changeset 与门禁等价 fixture 读取提交历史。
                  fetch-depth: 0

            - name: Check changeset presence (PR only)
              if: github.event_name == 'pull_request' && !contains(github.event.pull_request.title, '[no-changeset]')
              run: |
                  base="origin/${{ github.base_ref }}"
                  git fetch origin "${{ github.base_ref }}" --depth=1 || true
                  added=$(git diff --name-only "$base...HEAD" -- '.changeset/*.md' ':!.changeset/README.md' | wc -l)
                  code_changed=$(git diff --name-only "$base...HEAD" -- 'packages/ui/src/' 'packages/cli/src/' 'packages/ui/package.json' 'packages/cli/package.json' | wc -l)
                  if [ "$code_changed" -gt 0 ] && [ "$added" -eq 0 ]; then
                    echo "::error::代码变更未声明 changeset。请运行 'pnpm changeset' 生成变更说明；纯文档/CI 改动请在 PR 标题加 '[no-changeset]'。"
                    exit 1
                  fi
                  echo "✓ Changeset 检查通过（$added 个新增 changeset）"

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Cache turbo local build cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: node_modules/.cache/turbo
                  key: ${{ runner.os }}-turbo-quality-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-quality-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-
                      ${{ runner.os }}-turbo-quality-

            - name: Verify all generated and mixed files (read-only)
              run: |
                  pnpm --filter brutx-ui-vue generate -- --check
                  pnpm --filter brutx-vue generate -- --check

            - name: Build + typecheck + lint (turbo source graph)
              run: pnpm exec turbo run build:artifact typecheck:source lint:source

            - name: Check API dependency boundaries
              run: pnpm check:api-dependencies

            - name: Check API contract projections and exports
              run: pnpm check:exports

            - name: Validate registry
              run: pnpm exec turbo run validate --filter=brutx-registry-vue

            - name: Verify code and spec contracts (parallel)
              run: pnpm check:contracts

            - name: Run R3b tooling fault and equivalence checks
              run: pnpm test:tooling

            - name: Public type consumer check
              run: pnpm --filter brutx-ui-vue test:types

            - name: Verify bundle isolation
              run: pnpm --filter brutx-ui-vue check:isolation

            - name: Button resource lifecycle checks
              run: pnpm --filter brutx-ui-vue test src/components/button/button.resources.test.ts

            - name: Verify documentation integrity (parallel)
              run: pnpm check:docs

            - name: Package smoke test (exports subpaths + consumer resolution)
              run: pnpm --filter brutx-ui-vue test:package

            - name: Release verification and coordinator tests
              run: pnpm test:release

            - name: Check bundle size limits
              run: pnpm --filter brutx-ui-vue size

            - name: UI coverage (main and candidate)
              if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/vue')
              run: pnpm --filter brutx-ui-vue test:coverage

            - name: Commitlint on PR commits
              if: github.event_name == 'pull_request'
              env:
                  BASE_REF: ${{ github.base_ref }}
              run: |
                  # base 分支名经 env 传入，避免直接内插进 run: 脚本的注入风险
                  base="origin/$BASE_REF"
                  git fetch origin "$BASE_REF" --depth=50
                  # 两点 diff + --no-merges：PR 事件 checkout 检出的是合成 merge commit，三点 diff
                  # 会把该 merge 提交与 base 侧已合并提交一并纳入 → commitlint type-empty 恒红；
                  # --no-merges 排除合成 merge commit，只校验 PR 分支自身提交
                  git log --format=%s --no-merges "$base..HEAD" | while IFS= read -r subject; do
                    [ -z "$subject" ] && continue
                    echo "$subject" | pnpm exec commitlint || { echo "::error::提交信息不符合规范（描述≤50字符/type 合规）：$subject"; exit 1; }
                  done

            - name: i18n mirror check (report)
              run: pnpm check:i18n
              continue-on-error: true

    test:
        name: Test (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: [22, 24]
        env:
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Cache turbo local build cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: node_modules/.cache/turbo
                  key: ${{ runner.os }}-turbo-test-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-test-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-
                      ${{ runner.os }}-turbo-test-

            # test 与 test:ssr 都依赖 build:artifact，Turbo 会先生成并构建，再并行跑两个测试任务。
            - name: Build + test + SSR (turbo)
              run: pnpm exec turbo run build:artifact test test:ssr

    browser:
        name: Browser tests (Vitest + Playwright)
        runs-on: ubuntu-latest
        env:
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Cache turbo local build cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: node_modules/.cache/turbo
                  key: ${{ runner.os }}-turbo-browser-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-browser-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-
                      ${{ runner.os }}-turbo-browser-

            - name: Cache Playwright Browser Binaries
              id: playwright-cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: ${{ runner.os }}-playwright-

            - name: Clean up problematic APT repositories
              run: |
                  sudo rm -f /etc/apt/sources.list.d/azure-cli.list*
                  sudo rm -f /etc/apt/sources.list.d/microsoft*

            - name: Install Playwright Browser and Deps
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: pnpm --filter brutx-ui-vue exec playwright install --with-deps chromium

            - name: Install Playwright Dependencies (when cache hit)
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: pnpm --filter brutx-ui-vue exec playwright install-deps chromium

            - name: Build (turbo)
              run: pnpm build

            - name: Browser tests
              run: pnpm --filter brutx-ui-vue test:browser

            - name: Pack candidate artifact for cost checks
              run: |
                  cost_artifact_dir="$RUNNER_TEMP/brutx-cost-artifact"
                  mkdir -p "$cost_artifact_dir"
                  pnpm --config.ignore-scripts=true --filter brutx-ui-vue pack --pack-destination "$cost_artifact_dir"
                  cost_artifact="$(find "$cost_artifact_dir" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
                  if [ -z "$cost_artifact" ]; then
                    echo "::error::未找到候选 UI tarball，无法运行成本门禁。"
                    exit 1
                  fi
                  echo "BRUTX_COST_ARTIFACT=$cost_artifact" >> "$GITHUB_ENV"

            - name: Button browser resource and cost byte gates
              run: pnpm --filter brutx-ui-vue exec tsx perf/cost-runner.ts --artifact "$BRUTX_COST_ARTIFACT" --output "$RUNNER_TEMP/brutx-cost-result" --assert-resources

            - name: Upload Button cost evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: button-cost-${{ github.sha }}
                  path: ${{ runner.temp }}/brutx-cost-result
                  if-no-files-found: ignore

    integration:
        name: CLI Integration tests
        runs-on: ubuntu-latest
        env:
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Cache turbo local build cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: node_modules/.cache/turbo
                  key: ${{ runner.os }}-turbo-integration-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-integration-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-
                      ${{ runner.os }}-turbo-integration-

            - name: Build (turbo)
              run: pnpm build

            - name: CLI Integration tests
              run: pnpm --filter brutx-vue test:integration

    consumers:
        name: Real Consumer tests (U1 / C1 / C3)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Build packages
              run: pnpm build

            - name: Pack shared consumer artifacts
              run: node --input-type=module -e "import { packCandidateArtifacts } from './scripts/testing/consumer-artifacts.mjs'; packCandidateArtifacts(process.env.RUNNER_TEMP + '/brutx-consumers')"

            - name: Run consumer matrix tests
              run: pnpm test:consumers --all --artifacts "$RUNNER_TEMP/brutx-consumers"

            - name: Upload consumer evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: consumers-${{ github.sha }}
                  path: ${{ runner.temp }}/brutx-consumers
