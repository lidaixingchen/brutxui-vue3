name: Publish

on:
    push:
        tags:
            - 'v*'

concurrency:
    group: publish-global
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        env:
            # Turbo Remote Cache — Vercel Remote Cache
            # 配置步骤见 ci.yml 同名注释（TURBO_TOKEN 用 secrets，TURBO_TEAM 用 vars）
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM: ${{ vars.TURBO_TEAM }}
            # 发布环境注入官方签名私钥，构建时自动签发 registry-manifest。
            # 仅受信发布环境持有私钥；未配置时 build-registry.ts 保持产物未签名。
            BRUTX_REGISTRY_PRIVATE_KEY: ${{ secrets.BRUTX_REGISTRY_PRIVATE_KEY }}
            BRUTX_REGISTRY_KEY_ID: ${{ secrets.BRUTX_REGISTRY_KEY_ID }}
        permissions:
            contents: write
            id-token: write
            actions: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Bind release to successful main CI
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: node scripts/ci/require-release-ci.mjs

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: pnpm
                  registry-url: 'https://registry.npmjs.org'

            - name: Record Node runtime for Turbo task cache
              run: echo "BRUTX_RUNTIME_VERSION=$(node -p process.version)" >> "$GITHUB_ENV"

            - run: pnpm install --frozen-lockfile --prefer-offline

            - name: Cache turbo local build cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .turbo/cache
                  key: ${{ runner.os }}-turbo-node22-publish-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-node22-publish-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-
                      ${{ runner.os }}-turbo-node22-publish-

            - name: Verify generated artifacts consistency
              run: pnpm check:generated

            - name: Build signed release artifacts
              run: pnpm exec turbo run build:artifact --filter=brutx-ui-vue --filter=brutx-vue --filter=brutx-registry-vue

            - name: Verify changesets consumed
              run: |
                  if [ -d .changeset ] && [ -n "$(ls -A .changeset 2>/dev/null | grep -v config.json | grep -v README.md)" ]; then
                    echo "::error::Unconsumed changesets found — run 'pnpm version-packages' before tagging"
                    ls -A .changeset
                    exit 1
                  fi

            - name: Extract Release Notes from CHANGELOG
              env:
                  TAG: ${{ github.ref_name }}
              run: node scripts/release/extract-release-notes.mjs --tag "$TAG" --out "${{ runner.temp }}/release-notes.md"

            # 运行发布状态机协调器（实现密封产物打包、Release Draft/公开、npm 校验发布与 latest 推进）
            - name: Execute Unified Release Coordinator
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  TAG: ${{ github.ref_name }}
              run: |
                  node scripts/release/release-coordinator.mjs \
                      --tag "$TAG" \
                      --release-notes-file "${{ runner.temp }}/release-notes.md" \
                      --provenance
