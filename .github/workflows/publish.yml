name: Publish

on:
    push:
        tags:
            - 'v*'

concurrency:
    group: publish-global
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        env:
            # Turbo Remote Cache — Vercel Remote Cache（方案 §5.1；发布门禁 turbo run build/test/typecheck/lint 同样受益）
            # 配置步骤见 ci.yml 同名注释（TURBO_TOKEN 用 secrets，TURBO_TEAM 用 vars）
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM: ${{ vars.TURBO_TEAM }}
            # 基础设施闭环 P0：发布环境注入官方签名私钥，构建时自动签发 registry-manifest。
            # 仅受信发布环境持有私钥；未配置时 build-registry.ts 保持产物未签名（向后兼容）。
            BRUTX_REGISTRY_PRIVATE_KEY: ${{ secrets.BRUTX_REGISTRY_PRIVATE_KEY }}
            BRUTX_REGISTRY_KEY_ID: ${{ secrets.BRUTX_REGISTRY_KEY_ID }}
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1 # 发布门禁不需要 git 历史；gh release --generate-notes 走 API

            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: pnpm
                  registry-url: 'https://registry.npmjs.org'

            - run: pnpm install --frozen-lockfile

            - name: Cache turbo local build cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: node_modules/.cache/turbo
                  key: ${{ runner.os }}-turbo-publish-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-publish-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-
                      ${{ runner.os }}-turbo-publish-

            # 发布门禁：build + test + typecheck + lint（turbo 并行，test 依赖 build 自动等待）
            # test = vitest run（Node 环境），不需要 Playwright/浏览器
            - name: Release gate (turbo)
              run: pnpm exec turbo run build test typecheck lint

            - name: Verify changesets consumed
              run: |
                  if [ -d .changeset ] && [ -n "$(ls -A .changeset 2>/dev/null | grep -v config.json | grep -v README.md)" ]; then
                    echo "::error::Unconsumed changesets found — run 'pnpm version-packages' before tagging"
                    ls -A .changeset
                    exit 1
                  fi

            # 生成物一致性门禁：build 后校验 ui 侧自动生成文件与 commit 一致
            # 防止漏跑 prebuild-scan / generate-styles-tokens 的 tag 通过发布
            # （registry 产物为发布时构建、不入库，不在此检查范围，其完整性由上传前校验兜底）
            - name: Verify generated artifacts consistency
              run: |
                  git diff --exit-code -- \
                    packages/ui/registry-manifest.json \
                    packages/ui/src/styles.css \
                  || {
                    echo "::error::Generated artifacts are stale — run 'pnpm build' and commit the result before tagging"
                    git diff --stat -- \
                      packages/ui/registry-manifest.json \
                      packages/ui/src/styles.css
                    exit 1
                  }

            # Release 资产必须先于 npm publish 就绪：CLI 默认源指向 releases/latest/download，
            # 若 CLI 先发布而资产未上传，用户零配置拉取即 404，且 upload 失败会留下不可回滚状态。
            # 幂等写法：tag 重推/重跑时 release 已存在，直接 create 会失败阻断后续发布。
            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ github.ref_name }}
              run: |
                  gh release create "$TAG" \
                      --title "Release $TAG" \
                      --generate-notes \
                  || gh release edit "$TAG" --title "Release $TAG"

            # 上传前校验：产物齐全（index.json / registry-manifest.json / registry-sbom.json）、
            # 数量 = 90（排除本地可能遗留的 deps.json）、manifest 含 signature 且 keyId = official-v1
            - name: Verify registry artifacts ready for upload
              run: |
                  for f in index.json registry-manifest.json registry-sbom.json; do
                    if [ ! -f "packages/registry/registry/$f" ]; then
                      echo "::error::registry 产物缺失：packages/registry/registry/$f 不存在（请确认 Release gate 已构建）"
                      exit 1
                    fi
                  done
                  count=$(ls packages/registry/registry/*.json | grep -v 'deps\.json$' | wc -l)
                  if [ "$count" -ne 90 ]; then
                    echo "::error::registry 产物数量异常：期望 90 个 json（不含 deps.json），实际 $count"
                    exit 1
                  fi
                  node -e "
                  const m = require('./packages/registry/registry/registry-manifest.json');
                  if (!m.signature || m.keyId !== 'official-v1') {
                    console.error('::error::registry-manifest.json 缺少官方签名或 keyId 非 official-v1');
                    process.exit(1);
                  }
                  console.log('Registry manifest verified (keyId: ' + m.keyId + ')');
                  "

            # 上传 registry 产物为 Release 资产（扁平命名，可寻址 releases/latest/download/{name}.json）
            # --clobber：重推/重跑时覆盖同名资产，配合幂等 create 保证可重复执行
            - name: Upload registry artifacts to Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ github.ref_name }}
              run: |
                  gh release upload "$TAG" packages/registry/registry/*.json --clobber

            - name: Publish brutx-ui-vue
              working-directory: packages/ui
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  set +e
                  pnpm publish --no-git-checks --access public --provenance > /tmp/publish-ui.log 2>&1
                  status=$?
                  if [ $status -eq 0 ]; then
                    cat /tmp/publish-ui.log
                    exit 0
                  fi
                  if grep -qiE "EPUBLISHCONFLICT|already published|version already exists|cannot publish over the previously published" /tmp/publish-ui.log; then
                    echo "::warning::brutx-ui-vue version already exists, skipped"
                    exit 0
                  fi
                  cat /tmp/publish-ui.log >&2
                  exit $status

            - name: Publish brutx-vue
              working-directory: packages/cli
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  set +e
                  pnpm publish --no-git-checks --access public --provenance > /tmp/publish-cli.log 2>&1
                  status=$?
                  if [ $status -eq 0 ]; then
                    cat /tmp/publish-cli.log
                    exit 0
                  fi
                  if grep -qiE "EPUBLISHCONFLICT|already published|version already exists|cannot publish over the previously published" /tmp/publish-cli.log; then
                    echo "::warning::brutx-vue version already exists, skipped"
                    exit 0
                  fi
                  cat /tmp/publish-cli.log >&2
                  exit $status
