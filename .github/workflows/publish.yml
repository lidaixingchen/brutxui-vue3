name: Publish

on:
    push:
        tags:
            - 'v*'

concurrency:
    group: publish-global
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        env:
            # Turbo Remote Cache — Vercel Remote Cache（发布门禁 turbo run build/test/typecheck/lint 同样受益）
            # 配置步骤见 ci.yml 同名注释（TURBO_TOKEN 用 secrets，TURBO_TEAM 用 vars）
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM: ${{ vars.TURBO_TEAM }}
            # 发布环境注入官方签名私钥，构建时自动签发 registry-manifest。
            # 仅受信发布环境持有私钥；未配置时 build-registry.ts 保持产物未签名。
            BRUTX_REGISTRY_PRIVATE_KEY: ${{ secrets.BRUTX_REGISTRY_PRIVATE_KEY }}
            BRUTX_REGISTRY_KEY_ID: ${{ secrets.BRUTX_REGISTRY_KEY_ID }}
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1 # 发布门禁不需要 git 历史；extract-release-notes 直接从 CHANGELOG.md 读取

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: pnpm
                  registry-url: 'https://registry.npmjs.org'

            - run: pnpm install --frozen-lockfile

            - name: Cache turbo local build cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: node_modules/.cache/turbo
                  key: ${{ runner.os }}-turbo-publish-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-publish-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-
                      ${{ runner.os }}-turbo-publish-

            # 发布门禁：build + test + typecheck + lint（turbo 并行，test 依赖 build 自动等待）
            # test = vitest run（Node 环境），不需要 Playwright/浏览器
            - name: Verify generated artifacts consistency
              run: pnpm check:generated

            - name: Release gate (turbo)
              run: pnpm exec turbo run build:artifact test typecheck:source lint:source

            - name: Verify changesets consumed
              run: |
                  if [ -d .changeset ] && [ -n "$(ls -A .changeset 2>/dev/null | grep -v config.json | grep -v README.md)" ]; then
                    echo "::error::Unconsumed changesets found — run 'pnpm version-packages' before tagging"
                    ls -A .changeset
                    exit 1
                  fi

            - name: Release verification tests
              run: pnpm test:release

            - name: Extract Release Notes from CHANGELOG
              env:
                  TAG: ${{ github.ref_name }}
              run: node scripts/release/extract-release-notes.mjs --tag "$TAG" --out "${{ runner.temp }}/release-notes.md"

            # 运行发布状态机协调器（实现密封产物打包、Release Draft/公开、npm 校验发布与 latest 推进）
            - name: Execute Unified Release Coordinator
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  TAG: ${{ github.ref_name }}
              run: |
                  node scripts/release/release-coordinator.mjs \
                      --tag "$TAG" \
                      --release-notes-file "${{ runner.temp }}/release-notes.md" \
                      --provenance
