name: Sign Registry Manifest

# 基础设施闭环 P1：官方 registry 签名自动化。
#
# 背景：CLI（brutx-vue）默认从 GitHub Raw 拉取 main 分支的
# packages/registry/registry/registry-manifest.json，签名必须持久存在于 git 中；
# 但签名私钥仅发布环境持有，本地 pre-commit 钩子重新生成 registry 时只能产出
# 未签名 manifest。本 workflow 在 main push 后持官方私钥重新签名，
# 并以 [skip ci] 提交回 main，保证 CLI 严格模式（--require-signature）
# 拉取的官方 registry 始终带有效签名。
on:
    push:
        branches: [main]
        # 仅 ui/shared 源码与 registry 构建脚本变更需要重新签名；
        # 签名提交只改 registry-manifest.json，不在 paths 内，即使无 [skip ci] 也不会自触发
        paths:
            - 'packages/ui/src/**'
            - 'packages/shared/**'
            - 'packages/registry/scripts/**'
            - 'packages/registry/tests/**'

concurrency:
    group: registry-sign-global
    # 串行化：防止签名提交回 main 期间又有新 push 造成覆盖竞态（cancel 会导致丢签名）
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    sign:
        runs-on: ubuntu-latest
        env:
            BRUTX_REGISTRY_PRIVATE_KEY: ${{ secrets.BRUTX_REGISTRY_PRIVATE_KEY }}
            BRUTX_REGISTRY_KEY_ID: ${{ secrets.BRUTX_REGISTRY_KEY_ID }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1

            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            # 与 pre-commit 钩子相同的构建入口；CI 持有私钥 → 产出签名版 manifest
            - name: Regenerate registry with official signature
              run: pnpm --filter brutx-registry-vue build

            - name: Commit signed manifest back if changed
              run: |
                  set -e
                  MANIFEST=packages/registry/registry/registry-manifest.json
                  if git diff --exit-code -- "$MANIFEST" >/dev/null 2>&1; then
                      echo "manifest 与 git 一致（签名已就绪），无需回填"
                      exit 0
                  fi
                  echo "manifest 签名缺失或过期，回填签名版..."
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add "$MANIFEST"
                  # [skip ci]：防止签名提交再次触发 push 类 workflows（含本 workflow）形成循环
                  git commit -m "chore(registry): sign registry manifest with official key [skip ci]"
                  # 串行 concurrency 下竞争者仅前序 run（已完成）；rebase 兜底拉取其间的新 push
                  git pull --rebase origin main
                  git push origin main
