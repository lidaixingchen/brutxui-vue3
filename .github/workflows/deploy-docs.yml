name: Deploy Docs

on:
    workflow_run:
        workflows: ['CI']
        types: [completed]
        branches: [main]
    workflow_dispatch:

permissions: {}

jobs:
    prepare:
        if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
        outputs:
            deploy: ${{ steps.prepare.outputs.deploy }}
            artifact_name: ${{ steps.prepare.outputs.artifact_name }}
        steps:
            - name: Checkout deployment helper
              if: github.event_name == 'workflow_run'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: main
                  fetch-depth: 1

            - name: Prepare deployment
              id: prepare
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
                      {
                          echo "deploy=true"
                          echo "artifact_name="
                          echo "reason=manual-dispatch"
                      } >> "$GITHUB_OUTPUT"
                  else
                      node scripts/ci/docs-deployment.mjs
                  fi

    deploy:
        needs: prepare
        if: needs.prepare.outputs.deploy == 'true'
        concurrency:
            group: pages
            cancel-in-progress: true
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            pages: write
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              if: github.event_name == 'workflow_dispatch'
              with:
                  fetch-depth: 0 # VitePress lastUpdated 需要 git 历史获取每页最后修改时间

            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
              if: github.event_name == 'workflow_dispatch'

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              if: github.event_name == 'workflow_dispatch'
              with:
                  node-version: 22
                  cache: pnpm

            - name: Record Node runtime for Turbo task cache
              if: github.event_name == 'workflow_dispatch'
              run: echo "BRUTX_RUNTIME_VERSION=$(node -p process.version)" >> "$GITHUB_ENV"

            - name: Install dependencies
              if: github.event_name == 'workflow_dispatch'
              run: pnpm install --frozen-lockfile --prefer-offline

            - name: Cache turbo local build cache
              if: github.event_name == 'workflow_dispatch'
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .turbo/cache
                  key: ${{ runner.os }}-turbo-node22-docs-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-node22-docs-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-
                      ${{ runner.os }}-turbo-node22-docs-

            - name: Run documentation health check
              if: github.event_name == 'workflow_dispatch'
              run: pnpm check:docs

            - name: Build and typecheck docs
              if: github.event_name == 'workflow_dispatch'
              env:
                  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
                  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
              run: pnpm exec turbo run build:artifact typecheck:source --filter=docs

            - name: Download docs site artifact from CI
              if: github.event_name == 'workflow_run'
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: ${{ needs.prepare.outputs.artifact_name }}
                  path: apps/docs/.vitepress/dist
                  github-token: ${{ github.token }}
                  repository: ${{ github.repository }}
                  run-id: ${{ github.event.workflow_run.id }}
                  digest-mismatch: ignore

            - name: Setup Pages
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: apps/docs/.vitepress/dist
                  name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
              with:
                  artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
