name: Deploy Docs

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    # cancel-in-progress: true —— 新 push 会取消卡住的旧部署，避免排队 run 被
    # 僵尸等待 run 永久阻塞（曾出现 runner 供给故障导致队列死锁 16 小时）。
    cancel-in-progress: true

jobs:
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        env:
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0 # VitePress lastUpdated 需要 git 历史获取每页最后修改时间

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Cache turbo local build cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: node_modules/.cache/turbo
                  key: ${{ runner.os }}-turbo-docs-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-docs-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-
                      ${{ runner.os }}-turbo-docs-

            # turbo 自动处理依赖顺序：先 build brutx-ui-vue（及 shared），再 build docs
            # 配合 turbo 缓存，若 UI 源码未变则跳过 UI 构建
            - name: Build docs (turbo)
              run: pnpm build:docs

            - name: Setup Pages
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - name: Upload artifact
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: apps/docs/.vitepress/dist
                  name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
              with:
                  artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
